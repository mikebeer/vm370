#=====================================================================
# Minimal ESA/390 lab machine.
#
# Serves every test in this series -- the five DAT tests and the channel
# subsystem tests. Start Hercules on this, with the test of the moment
# pasted over hercules.rc in the same directory:
#
#     hercules -f herc.conf
#
# Hercules 3.07 reads hercules.rc from the working directory by itself,
# so give this its own directory. Never the CE one: CE's rc file would
# run instead, and its own config must stay ARCHMODE S/370 or CP dies at
# IPL.
#=====================================================================

# Mandatory. SSCH, MSCH, TSCH and STSCH are not generated for S/370 at
# all -- in S/370 mode they are operation exceptions, not slow paths.
# The same mode is what lets DAT reach above the 16 MB line.
ARCHMODE   ESA/390

# 64 MB. Only the above-the-line DAT tests need more than a couple of
# megabytes, but one size for all of them saves a config edit.
MAINSIZE   64

NUMCPU     1
CPUMODEL   3090

# Affects the EBCDIC-to-ASCII translation the console handler applies to
# whatever a test writes, so it decides whether the message is readable.
CODEPAGE   819-1047

# NOT the CE port. Both machines can then run at once and a stray 3270
# cannot land in the wrong one.
CNSLPORT   3278

#---------------------------------------------------------------------
# Exactly one device, and no DASD whatsoever.
#
# Two reasons, both learned the hard way:
#
# 1. Subchannel numbers are assigned sequentially from 0000 in THIS
#    FILE'S ORDER, not by device number. With one device, 0009 is
#    subchannel 0000 and the tests need no adjusting. Anything added
#    above this line shifts it. Add later devices BELOW.
#
# 2. A bare-metal test builds its own channel programs and has no
#    operating system to stop it addressing the wrong subchannel. Run
#    one against a config with CE packs attached and an untested CCW can
#    reach a writable disk. That nearly happened: a write command was
#    sent to subchannel 0000 while gccbrx.cckd was open for writing, and
#    only the device rejecting the command code prevented it. A config
#    with no DASD cannot do that at all.
#
# 3215-C, not plain 3215: without the suffix Hercules maps it to the
# 3270 handler, which is an entirely different code path and would
# reject the write.
#---------------------------------------------------------------------
0009   3215-C   /
